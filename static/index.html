<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>喜客丸AI小助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root{
    --brand:#e8543f; --brand-d:#c8432f; --bg:#f5f6f8; --card:#fff;
    --text:#1f2329; --sub:#8a9099; --line:#ececf0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
  }
  header{
    background:linear-gradient(135deg,var(--brand),var(--brand-d));
    color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:3;
  }
  header .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:18px}
  header .tbox{flex:1;min-width:0}
  header h1{font-size:16px;margin:0;font-weight:600}
  header p{font-size:11px;margin:2px 0 0;opacity:.85}
  header .hbtn{background:rgba(255,255,255,.18);border:none;color:#fff;
    height:34px;padding:0 12px;border-radius:10px;font-size:13px;flex:0 0 auto}
  header .hbtn:active{background:rgba(255,255,255,.34)}
  header #userBtn{width:34px;padding:0;font-size:18px}

  /* 群公告横幅 */
  #announce{background:#fff7e8;color:#9a5b00;border-bottom:1px solid #ffe2b8;
    padding:9px 14px;font-size:13px;line-height:1.5;display:none;z-index:2;
    white-space:pre-wrap;word-break:break-word}
  #announce b{color:var(--brand-d)}

  #toolbar{background:var(--card);border-bottom:1px solid var(--line);overflow:hidden;
    max-height:0;transition:max-height .26s ease;display:flex;flex-wrap:wrap;gap:8px;
    padding:0 12px;z-index:2}
  #toolbar.open{max-height:300px;padding:10px 12px;overflow-y:auto}
  .tool{flex:1 1 40%;min-width:84px;background:var(--bg);border:1px solid var(--line);
    color:var(--text);font-size:13px;padding:9px 6px;border-radius:10px;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:5px}
  .tool:active{background:#fff2ef;border-color:#f6d6cf;color:var(--brand-d)}
  .tool.active{background:#fff2ef;border-color:var(--brand);color:var(--brand-d)}

  #chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.5;font-size:15px;
    word-break:break-word;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);
    border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .msg.bot > *:first-child{margin-top:0}
  .msg.bot > *:last-child{margin-bottom:0}
  .msg.bot p{margin:0;line-height:1.5}
  .msg.bot p + p,.msg.bot p + ul,.msg.bot p + ol,.msg.bot p + h1,.msg.bot p + h2,.msg.bot p + h3{margin-top:.18em}
  .msg.bot p:empty,.msg.bot p:only-child:empty{display:none}
  .msg.bot h1,.msg.bot h2,.msg.bot h3{font-size:15px;margin:.25em 0 .08em;line-height:1.4}
  .msg.bot h1 + p,.msg.bot h2 + p,.msg.bot h3 + p{margin-top:0}
  .msg.bot ul,.msg.bot ol{margin:.05em 0;padding-left:1.25em}
  .msg.bot li{margin:0;line-height:1.5}
  .msg.bot li > p{margin:0}
  .msg.bot br{line-height:1}
  .msg.bot a{color:var(--brand)}
  .msg.bot code{background:#f0f1f3;padding:1px 4px;border-radius:4px;font-size:13px}
  .msg.bot pre{background:#f0f1f3;padding:10px;border-radius:8px;overflow-x:auto}
  .sources{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;background:#fff2ef;color:var(--brand-d);border:1px solid #f6d6cf;
    padding:2px 8px;border-radius:20px}
  .tag.web{background:#eef5ff;color:#2b6fd6;border-color:#d6e4fb}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .macts{display:flex;gap:8px;align-self:flex-start;margin:-4px 0 2px;padding-left:2px}
  .mact{font-size:12px;color:var(--brand-d);background:#fff2ef;border:1px solid #f6d6cf;
    padding:3px 10px;border-radius:14px;line-height:1.4}
  .mact:active{background:#f6d6cf}
  .mact.voted{background:#e8f7ee;border-color:#b8e6cc;color:#1a9d54;pointer-events:none}
  .mact.voted-down{background:#fff2ef;border-color:#f6d6cf;color:var(--brand-d);pointer-events:none}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--brand-d);
    font-size:13px;padding:7px 12px;border-radius:20px;white-space:nowrap}
  .chip:active{background:#fff2ef}
  footer{background:var(--card);border-top:1px solid var(--line);padding:8px 10px;
    padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
  #q{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:15px;
    outline:none;max-height:120px;resize:none;font-family:inherit;background:var(--bg)}
  #q:focus{border-color:var(--brand)}
  #send{background:var(--brand);color:#fff;border:none;border-radius:20px;padding:0 18px;
    height:42px;font-size:15px;font-weight:600;flex:0 0 auto}
  #send:disabled{opacity:.5}
  .empty{margin:auto;text-align:center;color:var(--sub);font-size:14px;padding:20px}
  .empty .big{font-size:46px;margin-bottom:10px}

  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);
    background:rgba(31,35,41,.92);color:#fff;font-size:13px;padding:8px 16px;border-radius:20px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:80%;
    text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #genMask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:19}
  #genMask.open{opacity:1;pointer-events:auto}
  #genSheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:20;
    border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 18px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:10px;
    transform:translateY(100%);transition:transform .25s ease}
  #genSheet.open{transform:translateY(0)}
  #genSheet h3{margin:0;font-size:16px;font-weight:600}
  #genSheet .ghint{font-size:12px;color:var(--sub);margin-top:-4px}
  #genInput{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;
    outline:none;font-family:inherit;background:var(--bg);resize:none;min-height:64px;max-height:140px}
  #genInput:focus{border-color:var(--brand)}
  #genSheet .grow{display:flex;gap:8px;margin-top:2px}
  .gbtn{flex:1;height:44px;border:none;border-radius:12px;font-size:15px;font-weight:600}
  .gbtn.go{background:var(--brand);color:#fff}
  .gbtn.cancel{background:var(--bg);color:var(--text);border:1px solid var(--line)}

  /* 登录/注册/忘记密码 */
  #auth{position:fixed;inset:0;background:linear-gradient(160deg,var(--brand),var(--brand-d));
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  #auth.hide{display:none}
  .acard{width:100%;max-width:360px;background:var(--card);border-radius:18px;padding:24px 20px;
    box-shadow:0 12px 40px rgba(0,0,0,.22)}
  .acard .alogo{width:52px;height:52px;border-radius:14px;margin:0 auto 12px;
    background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:26px}
  .acard h2{text-align:center;margin:0 0 4px;font-size:19px}
  .acard .asub{text-align:center;color:var(--sub);font-size:13px;margin:0 0 18px}
  .atabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
  .atab{flex:1;border:none;background:transparent;color:var(--sub);font-size:14px;
    padding:8px 0;border-radius:9px;font-weight:600}
  .atab.on{background:var(--card);color:var(--brand-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .ain{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:15px;outline:none;margin-bottom:10px;font-family:inherit;background:var(--bg)}
  .ain:focus{border-color:var(--brand)}
  .asubmit{width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;
    padding:13px 0;font-size:16px;font-weight:600;margin-top:4px}
  .asubmit:active{background:var(--brand-d)}
  .afoot{display:flex;justify-content:flex-end;margin-top:12px}
  .afoot a{color:var(--brand-d);font-size:13px;text-decoration:none}
  .amsg{color:var(--brand-d);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
  #appView{display:none;flex:1;flex-direction:column;min-height:0}
  #appView.show{display:flex}
</style>
</head>
<body>

<!-- 登录/注册/忘记密码 -->
<div id="auth">
  <div class="acard">
    <div class="alogo">📖</div>
    <h2 id="authTitle">喜客丸AI小助手</h2>
    <p class="asub" id="authSub">新员工培训 · 请登录后使用</p>
    <div class="atabs" id="atabs">
      <button class="atab on" data-tab="login">登录</button>
      <button class="atab" data-tab="register">注册</button>
    </div>
    <input id="aPhone" class="ain" inputmode="numeric" maxlength="11" placeholder="手机号" autocomplete="off" />
    <input id="aName" class="ain" placeholder="姓名（选填）" style="display:none" autocomplete="off" />
    <input id="aPwd" class="ain" type="password" placeholder="密码（至少6位）" autocomplete="off" />
    <button id="aSubmit" class="asubmit">登录</button>
    <div class="afoot"><a id="aForgot">忘记密码？</a></div>
    <div id="aMsg" class="amsg"></div>
  </div>
</div>

<!-- 主应用 -->
<div id="appView">
  <header>
    <div class="logo">📖</div>
    <div class="tbox"><h1 id="appTitle">喜客丸AI小助手</h1><p>基于内部资料库 · 联网核验 · 随时提问</p></div>
    <button id="adminBtn" class="hbtn" style="display:none" onclick="location.href='/admin'">后台</button>
    <button id="userBtn" class="hbtn" title="退出登录">👤</button>
  </header>

  <div id="announce"></div>

  <div id="toolbar">
    <button class="tool" id="tRegen"><span class="ic">🔄</span>重新生成</button>
    <button class="tool" id="tExport"><span class="ic">📤</span>导出对话</button>
    <button class="tool" id="tSrc"><span class="ic">📚</span>显示参考</button>
    <button class="tool" id="tClear"><span class="ic">🗑️</span>清空对话</button>
    <button class="tool" id="tScript"><span class="ic">💬</span>场景话术</button>
    <button class="tool" id="tFlow"><span class="ic">🪜</span>流程步骤</button>
    <button class="tool" id="tCard"><span class="ic">🃏</span>产品速查</button>
  </div>

  <div id="chat">
    <div class="empty" id="empty">
      <div class="big">👋</div>
      <div id="helloLine">你好，我是喜客丸AI小助手</div>
      <div style="margin-top:6px">工作上有不懂的，直接问我吧</div>
    </div>
  </div>

  <div class="chips" id="chips">
    <div class="chip">喜客丸品牌定位是什么？</div>
    <div class="chip">个体工商户怎么办理预包装食品？</div>
    <div class="chip">拓店人员怎么选目标门店？</div>
    <div class="chip">地推合作话术有哪些？</div>
    <div class="chip">2026年最新社保政策有什么变化？</div>
  </div>

  <footer>
    <textarea id="q" rows="1" placeholder="输入你的问题…"></textarea>
    <button id="send">发送</button>
  </footer>

  <div id="genMask"></div>
  <div id="genSheet">
    <h3 id="genTitle">场景话术生成</h3>
    <div class="ghint" id="genHint"></div>
    <textarea id="genInput" placeholder="请输入…"></textarea>
    <div class="grow">
      <button class="gbtn cancel" id="genCancel">取消</button>
      <button class="gbtn go" id="genGo">生成</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let currentName = '喜客丸AI小助手';
let currentUser = null;
const chat=document.getElementById('chat');
const q=document.getElementById('q');
const send=document.getElementById('send');
const chips=document.getElementById('chips');
const toolbar=document.getElementById('toolbar');
// 工具栏默认展开；如需折叠可手动 toolbar.classList.toggle('open')
let busy=false, lastQ='', showSrc=false;

marked.setOptions({breaks:true});

/* ---------- 通用：渲染 / 复制 / 提示 ---------- */
function render(el,text){
  const t=String(text||'').replace(/[ \t]*\n[ \t]*\n[ \t]*\n+[ \t\n]*/g,'\n\n').trim();
  if(window.marked&&window.DOMPurify){
    el.innerHTML=DOMPurify.sanitize(marked.parse(t));
  }else{
    el.textContent=text;
  }
  chat.scrollTop=chat.scrollHeight;
}
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy'); cb&&cb();}catch(e){toast('复制失败，请手动选择');}
  document.body.removeChild(ta);
}
function copyText(text,label){
  const ok=()=>toast('✓ 已复制'+(label?(' '+label):''));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(()=>fallbackCopy(text,ok));
  }else fallbackCopy(text,ok);
}

/* ---------- 消息构造 ---------- */
function removeEmpty(){const e=document.getElementById('empty'); if(e)e.remove();}
function addUser(text){
  removeEmpty();
  const d=document.createElement('div'); d.className='msg user';
  d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}
function addBot(){
  removeEmpty();
  const d=document.createElement('div'); d.className='msg bot';
  const b=document.createElement('div'); b.className='bubble';
  b.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
  d.appendChild(b); chat.appendChild(d);
  const acts=document.createElement('div'); acts.className='macts';
  const cb=document.createElement('button'); cb.className='mact'; cb.textContent='📋 复制';
  cb.onclick=()=>copyText(d._text||b.innerText);
  acts.appendChild(cb); chat.appendChild(acts);
  d._bubble=b; d._acts=acts; d._text=''; d._src=null;
  chat.scrollTop=chat.scrollHeight;
  return d;
}
function ensureSources(d){
  const old=d._bubble.querySelector('.sources'); if(old) old.remove();
  if(!d._src) return;
  const wrap=document.createElement('div'); wrap.className='sources';
  (d._src.kb||[]).forEach(s=>{const t=document.createElement('span');t.className='tag';t.textContent='📚 '+s;wrap.appendChild(t);});
  (d._src.web||[]).forEach(s=>{const t=document.createElement('span');t.className='tag web';t.textContent='🌐 '+s;wrap.appendChild(t);});
  if(wrap.children.length) d._bubble.appendChild(wrap);
}

/* ---------- 答案反馈 👍/👎 ---------- */
function addFeedbackBtns(acts, logId){
  if(!acts || acts._fbAdded) return;
  acts._fbAdded = true;
  const up=document.createElement('button'); up.className='mact'; up.textContent='👍';
  const dn=document.createElement('button'); dn.className='mact'; dn.textContent='👎';
  up.onclick=()=>submitFeedback(logId,'up',up,dn);
  dn.onclick=()=>{
    const c=prompt('请简要描述问题（选填）：');
    submitFeedback(logId,'down',up,dn,c||'');
  };
  acts.appendChild(up); acts.appendChild(dn);
}
async function submitFeedback(logId, rating, upBtn, dnBtn, comment){
  try{
    const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({log_id:logId, rating, comment:comment||null})});
    const d=await r.json();
    if(d.ok){
      if(rating==='up'){upBtn.classList.add('voted'); upBtn.textContent='👍 已点赞';}
      else{dnBtn.classList.add('voted-down'); dnBtn.textContent='👎 已反馈';}
      toast('感谢反馈！');
    }else{toast(d.error||'反馈失败');}
  }catch(e){toast('网络错误');}
}

/* ---------- 流式问答 ---------- */
async function stream(bot, question){
  let acc='', srcData=null;
  try{
    const res=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    if(res.status===401){ bootAuth(); return; }
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const block=buf.slice(0,idx); buf=buf.slice(idx+2);
        const ev=(block.match(/event: (.+)/)||[])[1];
        const dt=(block.match(/data: (.+)/s)||[])[1];
        if(!dt)continue;
        let data; try{data=JSON.parse(dt)}catch(e){continue}
        if(ev==='sources'){srcData=data; bot._src=data;}
        else if(ev==='token'){acc+=data; bot._text=acc; render(bot._bubble,acc);}
        else if(ev==='done'){
          bot._logId=data.log_id||null;
          if(showSrc&&srcData) ensureSources(bot);
          if(data.log_id) addFeedbackBtns(bot._acts, data.log_id);
        }
        else if(ev==='error'){acc+='\n⚠️ '+data.message; bot._text=acc; render(bot._bubble,acc);}
      }
    }
    if(!acc) bot._bubble.textContent='（未收到回答，请稍后重试）';
  }catch(e){
    bot._bubble.textContent='网络错误：'+e.message;
  }
}
async function ask(question){
  if(busy||!question.trim())return;
  busy=true; send.disabled=true; lastQ=question;
  addUser(question);
  await stream(addBot(), question);
  busy=false; send.disabled=false; q.value=''; q.style.height='auto';
}
async function regenerate(){
  if(busy||!lastQ){ toast(lastQ?'正在生成中…':'还没有可重新生成的内容'); return; }
  busy=true; send.disabled=true;
  await stream(addBot(), lastQ);
  busy=false; send.disabled=false;
}

/* ---------- 工具栏 ---------- */
toolbar.classList.add('open');
document.getElementById('tRegen').onclick=()=>{ regenerate(); };
document.getElementById('tClear').onclick=()=>{
  chat.innerHTML='';
  const e=document.createElement('div'); e.className='empty'; e.id='empty';
  e.innerHTML='<div class="big">👋</div><div>对话已清空</div><div style="margin-top:6px">工作上有不懂的，继续问我吧</div>';
  chat.appendChild(e); lastQ=''; toast('已清空对话');
};
document.getElementById('tExport').onclick=()=>{
  const msgs=[...chat.querySelectorAll('.msg')].map(m=>{
    const role=m.classList.contains('user')?'我':'小黄';
    const txt=m.classList.contains('user') ? m.textContent : (m._text||'');
    return role+'：'+txt;
  });
  if(!msgs.length){ toast('暂无对话内容'); return; }
  const text='【'+currentName+' 对话记录】\n'+new Date().toLocaleString()+'\n\n'+msgs.join('\n\n');
  copyText(text,'全部对话');
};
document.getElementById('tSrc').onclick=(ev)=>{
  showSrc=!showSrc;
  ev.currentTarget.classList.toggle('active',showSrc);
  document.querySelectorAll('.msg.bot').forEach(d=>{
    const old=d._bubble.querySelector('.sources'); if(old) old.remove();
    if(showSrc && d._src) ensureSources(d);
  });
  toast(showSrc?'已显示参考来源':'已隐藏参考来源');
};

/* ---------- 生成器：场景话术 / 流程步骤 / 产品速查 ---------- */
const genSheet=document.getElementById('genSheet');
const genMask=document.getElementById('genMask');
const genTitle=document.getElementById('genTitle');
const genHint=document.getElementById('genHint');
const genInput=document.getElementById('genInput');
let genBuilder=null;
const GEN={
  script:{title:'场景话术生成', hint:'描述场景，例如：向社区便利店老板介绍喜客丸并谈合作',
    build:s=>`请为以下场景生成一段可直接使用的沟通话术：\n场景：${s}\n要求：口语化、自然、符合喜客丸品牌调性；按"开场—介绍—利益点—促成"四段组织；基于内部资料库，不确定的标注待核实。`},
  flow:{title:'流程步骤卡', hint:'描述要拆解的流程，例如：新员工办理预包装食品经营备案',
    build:s=>`请把"${s}"整理成一张清晰的流程步骤卡：分步骤编号、每步一句话说明、标注关键注意点/所需材料；基于内部资料库，不确定的标注待核实。`},
  card:{title:'产品速查卡', hint:'填产品/品牌名，例如：喜客丸',
    build:s=>`请为"${s}"生成一张产品速查卡：①一句话定位 ②核心卖点(3-5条) ③适用人群 ④常见问答(3条)。基于内部资料库，不确定的标注待核实。`}
};
function openGen(key){
  const g=GEN[key]; if(!g)return;
  genBuilder=g.build; genTitle.textContent=g.title; genHint.textContent=g.hint;
  genInput.value=''; genInput.placeholder='请输入：'+g.hint;
  genSheet.classList.add('open'); genMask.classList.add('open');
  setTimeout(()=>genInput.focus(),260);
}
function closeGen(){genSheet.classList.remove('open');genMask.classList.remove('open');}
document.getElementById('tScript').onclick=()=>openGen('script');
document.getElementById('tFlow').onclick=()=>openGen('flow');
document.getElementById('tCard').onclick=()=>openGen('card');
genMask.onclick=closeGen;
document.getElementById('genCancel').onclick=closeGen;
document.getElementById('genGo').onclick=()=>{
  const s=genInput.value.trim(); if(!s){toast('请先填写内容');return;}
  const prompt=genBuilder(s); closeGen(); ask(prompt);
};
genInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('genGo').click();}});

/* ---------- 输入交互 ---------- */
send.onclick=()=>ask(q.value);
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(q.value);}
});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,120)+'px';});
chips.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));

/* ================= 账号 / 鉴权 ================= */
const authEl=document.getElementById('auth');
const appView=document.getElementById('appView');
const aPhone=document.getElementById('aPhone');
const aName=document.getElementById('aName');
const aPwd=document.getElementById('aPwd');
const aSubmit=document.getElementById('aSubmit');
const aMsg=document.getElementById('aMsg');
const aForgot=document.getElementById('aForgot');
const atabs=document.getElementById('atabs');
let authTab='login';
let forgotMode=false;

function showAuth(){ authEl.classList.remove('hide'); appView.classList.remove('show'); }
function showApp(){ authEl.classList.add('hide'); appView.classList.add('show'); }

function setAuthMsg(m,ok){ aMsg.textContent=m||''; aMsg.style.color=ok?'#1a9d54':'var(--brand-d)'; }

function refreshAuthUI(){
  if(forgotMode){
    atabs.style.display='none';
    aName.style.display='none';
    aPhone.style.display='';
    aPwd.style.display='none';
    aSubmit.textContent='提交重置申请';
    document.getElementById('authTitle').textContent=currentName;
    document.getElementById('authSub').textContent='忘记密码 · 提交后由总部管理员重置';
    aForgot.textContent='返回登录';
    return;
  }
  atabs.style.display='';
  aForgot.textContent='忘记密码？';
  document.getElementById('authTitle').textContent=currentName;
  if(authTab==='register'){
    aName.style.display='';
    aSubmit.textContent='注册并登录';
    document.getElementById('authSub').textContent='新员工注册 · 使用手机号+密码';
  }else{
    aName.style.display='none';
    aSubmit.textContent='登录';
    document.getElementById('authSub').textContent='新员工培训 · 请登录后使用';
  }
}

atabs.querySelectorAll('.atab').forEach(b=>{
  b.onclick=()=>{
    atabs.querySelectorAll('.atab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    authTab=b.dataset.tab; forgotMode=false; setAuthMsg(''); refreshAuthUI();
  };
});
aForgot.onclick=()=>{ forgotMode=!forgotMode; setAuthMsg(''); refreshAuthUI(); };

aSubmit.onclick=async()=>{
  setAuthMsg('');
  const phone=aPhone.value.trim();
  const pwd=aPwd.value;
  const name=aName.value.trim();
  if(forgotMode){
    if(!/^1[3-9]\d{9}$/.test(phone)){ setAuthMsg('请输入正确的手机号'); return; }
    const r=await fetch('/api/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    const d=await r.json();
    if(d.ok){ setAuthMsg('已提交，请联系总部管理员重置密码',true); }
    else setAuthMsg(d.error||'提交失败');
    return;
  }
  if(!/^1[3-9]\d{9}$/.test(phone)){ setAuthMsg('请输入正确的手机号'); return; }
  if(!pwd||pwd.length<6){ setAuthMsg('密码至少 6 位'); return; }
  let url = authTab==='register' ? '/api/register' : '/api/login';
  const body = authTab==='register' ? {phone,password:pwd,name} : {phone,password:pwd};
  aSubmit.disabled=true;
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok){ currentUser=d.user; enterApp(); }
    else setAuthMsg(d.error||'操作失败');
  }catch(e){ setAuthMsg('网络错误：'+e.message); }
  aSubmit.disabled=false;
};

document.getElementById('userBtn').onclick=async()=>{
  if(!confirm('确认退出登录？')) return;
  await fetch('/api/logout',{method:'POST'});
  currentUser=null; showAuth();
};

async function loadConfig(){
  try{
    const r=await fetch('/api/config'); const c=await r.json();
    currentName=c.assistant_name||'喜客丸AI小助手';
    document.getElementById('appTitle').textContent=currentName;
    document.getElementById('authTitle').textContent=currentName;
    document.getElementById('helloLine').textContent='你好，我是'+currentName;
    const ann=document.getElementById('announce');
    if(c.announcement && c.announcement.trim()){ ann.textContent=c.announcement; ann.style.display='block'; }
    else ann.style.display='none';
  }catch(e){}
}

async function enterApp(){
  showApp();
  await loadConfig();
  document.getElementById('adminBtn').style.display = (currentUser&&currentUser.role==='admin')?'':'none';
}

function bootAuth(){
  // 进入页先判断登录态
  fetch('/api/me').then(r=>r.json()).then(d=>{
    if(d.user){
      currentUser=d.user; enterApp();
    }else{
      currentUser=null; refreshAuthUI(); showAuth();
    }
  }).catch(()=>{ refreshAuthUI(); showAuth(); });
}
bootAuth();
</script>
</body>
</html>
